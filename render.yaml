services:
  - type: web
    name: komek-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.6
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: SECRET
        generateValue: true
